services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: propnest_backend
    # Match whichever host UID/GID owns the bind-mounted repo below —
    # the image's own non-root `appuser` (baked in for the no-bind-mount,
    # production case) won't generally match the host user, so writes
    # under the mounted tree (e.g. .ruff_cache, logs/) would otherwise
    # fail with EACCES. HOST_UID/HOST_GID are exported by the Makefile's
    # $(COMPOSE) (plain `UID`/`GID` are readonly shell variables).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8000:8000"
    environment:
      - ENV=${ENV:-dev}
    volumes:
      - ..:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
    networks:
      propnest_network:
        aliases:
          - propnest.backend.api

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: propnest_worker
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["arq", "app.jobs.billing_jobs.WorkerSettings"]
    environment:
      - ENV=${ENV:-dev}
    volumes:
      - ..:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      propnest_network:
        aliases:
          - propnest.backend.worker

  # One-off migration runner: applies `alembic upgrade head` exactly once and exits.
  # backend/worker depend on this completing successfully instead of each racing to
  # run migrations themselves (that race previously deadlocked Postgres on the
  # CREATE INDEX CONCURRENTLY migration — see alembic/versions/967935f1428a).
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: propnest_migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      - ENV=${ENV:-dev}
    volumes:
      - ..:/app
    depends_on:
      - db
    networks:
      propnest_network:
        aliases:
          - propnest.backend.migrate

  db:
    image: postgres:16-alpine
    container_name: propnest_db
    environment:
      POSTGRES_USER: propnest
      POSTGRES_PASSWORD: propnest_secret
      POSTGRES_DB: propnest_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      propnest_network:
        aliases:
          - propnest.backend.postgres

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: propnest_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: propnest_minio
      MINIO_ROOT_PASSWORD: propnest_secret
      MINIO_VOLUMES: "/data"
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      propnest_network:
        aliases:
          - propnest.backend.minio

  redis:
    image: redis:7-alpine
    container_name: propnest_redis
    # No persistence needed - rate-limit/lockout state is short-lived and 
    # safe to lose on restart (worst case: counters reset to zero).
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    networks:
      propnest_network:
        aliases:
          - propnest.backend.redis

networks:
  propnest_network:
    driver: bridge

volumes:
  pgdata:
  miniodata:
